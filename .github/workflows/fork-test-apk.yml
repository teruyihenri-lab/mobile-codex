name: Fork Android test APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # No signing credentials or release publication on the public fork.
    if: github.repository == 'teruyihenri-lab/mobile-codex'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MOBILE_CODEX_FORK_TEST: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          python3 -m pip install -r tools/requirements-devtools.txt
      - name: Test source and runtime packaging logic
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh fork-only Termux package lock
        run: |
          # Termux is a rolling repository. The checked-in snapshot contains
          # versions that have been removed from its package pool. Resolve a
          # fresh, content-addressed lock for this isolated debug build only.
          # The production release workflow retains its checked-in lock.
          rm -f .runtime-cache/termux-Packages
          python3 tools/prepare_devtools.py --write-lock
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("tools/devtools-lock.json").read_text())
          packages = lock["packages"]
          assert packages and all(len(p["sha256"]) == 64 and p["filename"].startswith("pool/") for p in packages)
          print("Fork test lock: " + str(len(packages)) + " hash-pinned Termux packages, index SHA-256 " + lock["index"]["sha256"])
          PY
      - name: Prepare pinned ARM64 runtime and developer tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 tools/prepare_runtime.py
          python3 tools/build_native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          python3 tools/prepare_devtools.py
          python3 tools/prepare_devtools.py --verify
      - name: Build debug APK, compile Android tests, run unit tests and lint
        run: ./gradlew --no-daemon --build-cache assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Verify APK and distinct application ID
        run: |
          set -eu
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "^package: name='dev.mobilecodex.app.fork'"
          mkdir -p artifacts/fork-debug
          sha256sum "$apk" > artifacts/fork-debug/SHA256SUMS
          cp docs/fork-build.md artifacts/fork-debug/INSTALL.md
      - name: Check responsive browser layouts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          npm run test:layout
      - name: Upload verified installable test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-codex-fork-test-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            artifacts/fork-debug/SHA256SUMS
            artifacts/fork-debug/INSTALL.md
            tools/devtools-lock.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
